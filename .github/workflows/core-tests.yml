name: Standalone core tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'rust/**'
      - 'python/pig_governor/**'
      - 'patches/**'
      - 'tests/**'
      - '.github/workflows/core-tests.yml'
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'python/pig_governor/**'
      - 'patches/**'
      - 'tests/**'
      - '.github/workflows/core-tests.yml'

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test Rust core and build the real FFI library
        shell: bash
        env:
          CORE_TARGET_DIR: ${{ runner.temp }}/pig-governor-target
        run: |
          mkdir -p "$CORE_TARGET_DIR"
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/source,readonly" \
            --mount "type=bind,source=$CORE_TARGET_DIR,target=/target" \
            --env CARGO_HOME=/tmp/cargo \
            --env CARGO_TARGET_DIR=/target \
            rust:1.98.1-bookworm@sha256:c49256cbe5ea0188bc658a689500d70c41eb51f009a7a7be209caf60a944f3ec \
            sh -eu -c '
              cargo test --manifest-path /source/rust/Cargo.toml --locked --offline
              cargo build --manifest-path /source/rust/Cargo.toml --release --locked --offline
            '
      - name: Test Python against the real Rust FFI library
        shell: bash
        env:
          PYTHONPATH: python
          PIG_GOVERNOR_LIBRARY: ${{ runner.temp }}/pig-governor-target/release/libpig_governor_core.so
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p test_ffi.py -v
      - name: Upload Governor library
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governor-library
          path: ${{ runner.temp }}/pig-governor-target/release/libpig_governor_core.so
          if-no-files-found: error

  integration-tests:
    needs: core-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/phala-network/sglang:v0.5.20-phala-shared-governor-r1@sha256:a5142ca8abe0c73c758eb10e21ca9b843a6da4066191c8a9514ed23a7d4fda21
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout pinned clean SGLang source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Phala-Network/sglang
          ref: 63a21f09fcc26892a6d30c76945b783aa0eb3149
          path: sglang-clean-base
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: governor-library
          path: .artifacts
      - name: Apply Governor hooks to the pinned clean SGLang base
        shell: bash
        run: |
          base_dir="$GITHUB_WORKSPACE/sglang-clean-base"
          base=63a21f09fcc26892a6d30c76945b783aa0eb3149
          actual=$(git -C "$base_dir" rev-parse HEAD)
          test "$actual" = "$base"
          git -C "$base_dir" apply --check "$GITHUB_WORKSPACE/patches/sglang/v0.5.20/0001-governor-hooks.patch"
          git -C "$base_dir" apply "$GITHUB_WORKSPACE/patches/sglang/v0.5.20/0001-governor-hooks.patch"
          python -m compileall -q \
            "$base_dir/python/sglang/srt/entrypoints/http_server.py" \
            "$base_dir/python/sglang/srt/managers/io_struct.py" \
            "$base_dir/python/sglang/srt/managers/scheduler.py"
      - name: Run Python integration tests against the patched SGLang base
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/sglang-clean-base/python:$GITHUB_WORKSPACE/python"
          export PIG_GOVERNOR_LIBRARY="$GITHUB_WORKSPACE/.artifacts/libpig_governor_core.so"
          python - <<'PY'
          import os
          import pig_governor

          expected = os.path.realpath(
              os.path.join(os.environ["GITHUB_WORKSPACE"], "python", "pig_governor", "__init__.py")
          )
          actual = os.path.realpath(pig_governor.__file__)
          if actual != expected:
              raise RuntimeError(f"Imported Governor from {actual}, expected {expected}")
          if not os.path.isfile(os.environ["PIG_GOVERNOR_LIBRARY"]):
              raise RuntimeError("Downloaded Governor library is missing")
          PY
          python -m unittest discover -s tests -p test_*.py -v
