name: Standalone core tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'rust/**'
      - 'python/pig_governor/**'
      - 'patches/**'
      - 'tests/**'
      - '.github/workflows/core-tests.yml'
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'python/pig_governor/**'
      - 'patches/**'
      - 'tests/**'
      - '.github/workflows/core-tests.yml'

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test Rust core and build the real FFI library
        shell: bash
        env:
          CORE_TARGET_DIR: ${{ runner.temp }}/pig-governor-target
        run: |
          mkdir -p "$CORE_TARGET_DIR"
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/source,readonly" \
            --mount "type=bind,source=$CORE_TARGET_DIR,target=/target" \
            --env CARGO_HOME=/tmp/cargo \
            --env CARGO_TARGET_DIR=/target \
            rust:1.98.1-bookworm@sha256:c49256cbe5ea0188bc658a689500d70c41eb51f009a7a7be209caf60a944f3ec \
            sh -eu -c '
              cargo test --manifest-path /source/rust/Cargo.toml --locked --offline
              cargo build --manifest-path /source/rust/Cargo.toml --release --locked --offline
            '
      - name: Test Python against the real Rust FFI library
        shell: bash
        env:
          PYTHONPATH: python
          PIG_GOVERNOR_LIBRARY: ${{ runner.temp }}/pig-governor-target/release/libpig_governor_core.so
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p test_ffi.py -v
      - name: Upload Governor library
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governor-library
          path: ${{ runner.temp }}/pig-governor-target/release/libpig_governor_core.so
          if-no-files-found: error

  integration-tests:
    needs: core-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/phala-network/sglang:dev-d752488ed6-gov-fa79d6d753-recipe-6af26b8@sha256:1f5377e5007d7361fd0ce478d1e2c22e13c48d0114be513fac34a53a98a34a9a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout compatible complete Phala SGLang source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Phala-Network/sglang
          ref: c9c6c824e5a607b94260c29f137a8c822f65aaad
          path: sglang-complete
          persist-credentials: false
      - name: Checkout compatible serving patches
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Phala-Network/sglang-serving-patches
          ref: 3a0f049cb287f0c3ec4f2d9fb56c31cbc5fda825
          path: serving-patches
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: governor-library
          path: .artifacts
      - name: Verify compatible engine and embedded Governor hooks
        shell: bash
        run: |
          engine_dir="$GITHUB_WORKSPACE/sglang-complete"
          engine=c9c6c824e5a607b94260c29f137a8c822f65aaad
          engine_tree=837df64283dae3e8d5d471b8b2e6f7f35d95a4dc
          serving_patches=3a0f049cb287f0c3ec4f2d9fb56c31cbc5fda825
          serving_patches_tree=923acaa59566901271efc57875db0bd3ad32ba5a
          test "$(git -C "$engine_dir" rev-parse HEAD)" = "$engine"
          test "$(git -C "$engine_dir" rev-parse HEAD^{tree})" = "$engine_tree"
          test "$(git -C "$GITHUB_WORKSPACE/serving-patches" rev-parse HEAD)" = "$serving_patches"
          test "$(git -C "$GITHUB_WORKSPACE/serving-patches" rev-parse HEAD^{tree})" = "$serving_patches_tree"
          printf 'engine_commit=%s\nengine_tree=%s\nserving_patches_commit=%s\nserving_patches_tree=%s\n' \
            "$engine" "$engine_tree" "$serving_patches" "$serving_patches_tree" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q 'from pig_governor.sglang import create' "$engine_dir/python/sglang/srt/managers/scheduler.py"
          grep -q '/admin/v1/predictive-policy' "$engine_dir/python/sglang/srt/entrypoints/http_server.py"
          python -m compileall -q \
            "$engine_dir/python/sglang/srt/entrypoints/http_server.py" \
            "$engine_dir/python/sglang/srt/managers/io_struct.py" \
            "$engine_dir/python/sglang/srt/managers/scheduler.py"
      - name: Run Python integration tests against the compatible SGLang source
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/sglang-complete/test/registered/unit/entrypoints/openai:$GITHUB_WORKSPACE/sglang-complete/python:$GITHUB_WORKSPACE/python"
          export PIG_GOVERNOR_LIBRARY="$GITHUB_WORKSPACE/.artifacts/libpig_governor_core.so"
          python - <<'PY'
          import os
          import pig_governor

          expected = os.path.realpath(
              os.path.join(os.environ["GITHUB_WORKSPACE"], "python", "pig_governor", "__init__.py")
          )
          actual = os.path.realpath(pig_governor.__file__)
          if actual != expected:
              raise RuntimeError(f"Imported Governor from {actual}, expected {expected}")
          if not os.path.isfile(os.environ["PIG_GOVERNOR_LIBRARY"]):
              raise RuntimeError("Downloaded Governor library is missing")
          PY
          python -m unittest discover -s tests -p test_*.py -v
