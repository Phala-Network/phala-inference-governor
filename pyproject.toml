[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pig-governor"
version = "0.1.1"
description = "Independent soft throughput controller with explicit SGLang integration"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["python"]
